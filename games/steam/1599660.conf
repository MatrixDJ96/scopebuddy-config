# Sackboy: A Big Adventure

# Enable OptiScaler
# export WINEDLLOVERRIDES="dxgi.dll=n,b"

# Resolve the main game content directories
CONTENT_DIRECTORY="${GAME_DIRECTORY}/../../Content"
MODS_DIRECTORY="${CONTENT_DIRECTORY}/Paks/~mods"
MOVIES_DIRECTORY="${CONTENT_DIRECTORY}/Movies"

# Resolve local files used by this config
LAUNCHER_CONFIG="${GAME_DIRECTORY}/Launcher.ini"
DISABLE_EOS_MOD="${MODS_DIRECTORY}/DisableEOS.pak"
DISABLE_EOS_ARCHIVE="${MODS_DIRECTORY}/DisableEOS.7z"

# Remove Epic Online Services installers
rm -f "${GAME_DIRECTORY}/eos_installscript.vdf"
rm -f "${GAME_DIRECTORY}/EpicOnlineServicesInstaller.exe"

# Disable launcher operations
if [[ -f ${LAUNCHER_CONFIG} ]]; then
  sed -i 's/NoOperation.*/NoOperation=1/g' "${LAUNCHER_CONFIG}"
fi

# Remove startup videos
rm -f "${MOVIES_DIRECTORY}/IntroSequence/PS_STUDIOS_WS.mp4"
rm -f "${MOVIES_DIRECTORY}/IntroSequence/PS_STUDIOS_4k.mp4"
rm -f "${MOVIES_DIRECTORY}/IntroSequence/PS_STUDIOS_1080.mp4"
rm -f "${MOVIES_DIRECTORY}/IntroSequence/SumoSatRed4k_Global.mp4"
rm -f "${MOVIES_DIRECTORY}/IntroSequence/SumoSatRedUltraWide_Global.mp4"

# Ensure the mods directory exists
mkdir -p "${MODS_DIRECTORY}"

# Download and extract the DisableEOS mod
if [[ ! -f ${DISABLE_EOS_MOD} ]]; then
  download_game_file \
    "${DISABLE_EOS_ARCHIVE}" \
    "https://gamebanana.com/dl/1172382"

  if [[ -f ${DISABLE_EOS_ARCHIVE} ]]; then
    7z x "${DISABLE_EOS_ARCHIVE}" -o"${MODS_DIRECTORY}" -y
    rm -f "${DISABLE_EOS_ARCHIVE}"
  fi
fi

# Enable DLSS override
enable_dlss_override latest k

# Enable DLSS indicator
# enable_dlss_indicator

# Force use of D3D11
command+=" -dx11"
