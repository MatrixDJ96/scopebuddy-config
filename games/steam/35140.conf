# Batman: Arkham Asylum

# Enable HBAO+
export DXVK_NVAPI_DRS_SETTINGS=0x664339=1,0x667329=2,0x2C7F45=48

# DirectX compatibility
execute_prefix_winetricks d3d9 \
  d3dx9 d3dx9_43 d3dcompiler_43 mdx

# PhysX support for NVIDIA
install_physx_legacy

# Install fonts required by the launcher
execute_prefix_winetricks fonts calibri impact
