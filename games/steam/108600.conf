# Project Zomboid

# Game config directory
GAME_CONFIG_PATH="Zomboid"

# Saves and settings shared with the Windows install
symlink_directory \
  "${WINDOWS_USER_PATH}/${GAME_CONFIG_PATH}" \
  "${USER_DATA_PATH}/${GAME_CONFIG_PATH}"

# Enable Gamescope
enable_gamescope

# Render at 1080p
add_gamescope_flag "-w 1920" "-h 1080"

# Game data and cache in the symlinked directory
command+=" -Duser.home=${USER_DATA_PATH}/${GAME_CONFIG_PATH}"
command+=" -cachedir=${USER_DATA_PATH}/${GAME_CONFIG_PATH}"

# Start without the Steam API
command+=" -nosteam"
