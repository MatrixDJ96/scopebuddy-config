# Atomic Heart

# Enable OptiScaler
# export WINEDLLOVERRIDES="dxgi.dll=n,b"

# Resolve the main game content directories
CONTENT_DIRECTORY="${GAME_DIRECTORY}/AtomicHeart/Content"
MODS_DIRECTORY="${CONTENT_DIRECTORY}/Paks/~mods"
MOVIES_DIRECTORY="${CONTENT_DIRECTORY}/Movies"

# Remove startup videos
rm -f "${MOVIES_DIRECTORY}/Launch_4k_60FPS_PS5.mp4"
rm -f "${MOVIES_DIRECTORY}/Launch_4k_60FPS_XboxXS.mp4"
rm -f "${MOVIES_DIRECTORY}/Launch_FHD_30FPS_PS4.mp4"
rm -f "${MOVIES_DIRECTORY}/Launch_FHD_30FPS_XboxOne.mp4"
rm -f "${MOVIES_DIRECTORY}/Launch_FHD_60FPS_PC_Steam.mp4"

# Ensure the mods directory exists
mkdir -p "${MODS_DIRECTORY}"

# Set framerate limit
set_framerate_limit 120

# Enable DLSS override
enable_dlss_override

# Enable DLSS indicator
# enable_dlss_indicator

# Force use of D3D11
# command+=" -dx11"
