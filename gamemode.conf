# ScopeBuddy game mode profile

# Load the shared runtime, helper functions and config loaders
source "${SCB_CONFIGDIR}/scripts/bootstrap.sh"

# Apply the game mode profile and then load gamemode.local.conf if present
load_profile_configs "gamemode"

# Resolve the current game executable from the launch command
resolve_game_executable

# Load the shared game config and then the local game config if present
load_game_configs
