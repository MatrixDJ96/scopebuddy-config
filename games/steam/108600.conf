# Project Zomboid

# Resolve game paths
GAME_CONFIG_PATH="Zomboid"

# Symlink user data to Windows user path
symlink_directory \
  "${WINDOWS_USER_PATH}/${GAME_CONFIG_PATH}" \
  "${USER_DATA_PATH}/${GAME_CONFIG_PATH}"

# Enable Gamescope
enable_gamescope

# Force resolution at 1080p
add_gamescope_flag "-w 1920" "-h 1080"

# Set custom Java user data path to match symlink
command+=" -Duser.home=${USER_DATA_PATH}/${GAME_CONFIG_PATH}"
command+=" -cachedir=${USER_DATA_PATH}/${GAME_CONFIG_PATH}"

# Remove Steam dependency
command+=" -nosteam"
