# The Last of Us™ Part I

# Enable mods support
export WINEDLLOVERRIDES="version.dll=n,b;xinput1_4.dll=n,b"

# Enable Gamescope
enable_gamescope

# Enable auto HDR
enable_auto_hdr

# Set framerate limit
set_framerate_limit 120

# Enable DLSS override
enable_dlss_override

# Enable DLSS indicator
# enable_dlss_indicator
