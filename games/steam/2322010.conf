# God of War Ragnarök

# Enable mods support
export WINEDLLOVERRIDES="version.dll=n,b"

# Install NoPSSDK
install_nopssdk_v103

# Enable Gamescope
enable_gamescope

# Enable auto HDR
enable_auto_hdr

# Set framerate limit
set_framerate_limit 120

# Enable DLSS override
enable_dlss_override

# Enable DLSS indicator
# enable_dlss_indicator
