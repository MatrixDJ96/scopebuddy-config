# Factorio

# Game config directory
GAME_CONFIG_PATH="Factorio"

# Saves and settings shared with the Windows install
if [[ ${SCB_GAME_NATIVE} == "1" ]]; then
  symlink_directory \
    "${WINDOWS_ROAMING_PATH}/${GAME_CONFIG_PATH}" \
    "${HOME}/.factorio"
else
  symlink_directory \
    "${WINDOWS_ROAMING_PATH}/${GAME_CONFIG_PATH}" \
    "${PREFIX_ROAMING_PATH}/${GAME_CONFIG_PATH}"
fi
