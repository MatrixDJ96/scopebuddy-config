# Warcraft III

# Enable d3d8to9 translation support
export WINEDLLOVERRIDES="d3d8.dll=n,b"

# Resolve Wine paths from the current game directory
GAME_DIRECTORY_WIN="Z:${GAME_DIRECTORY//\//\\}"

# Resolve Warcraft III executables
PROGRAM_WIN="${GAME_DIRECTORY_WIN}\Warcraft III.exe"
PROGRAM_X_WIN="${GAME_DIRECTORY_WIN}\Frozen Throne.exe"

# Resolve Warcraft III registry keys
REG_KEY="HKEY_CURRENT_USER\Software\Blizzard Entertainment\Warcraft III"
SOUND_REG_KEY="${REG_KEY}\Sound"
VIDEO_REG_KEY="${REG_KEY}\Video"

# Resolve display settings
RES_WIDTH="${RES_WIDTH:-1920}"
RES_HEIGHT="${RES_HEIGHT:-1080}"
REFRESH_RATE="${REFRESH_RATE:-60}"
MAX_FPS="${MAX_FPS:-120}"

# Root registry values
REG_VALUES=(
  "InstallPath|REG_SZ|${GAME_DIRECTORY_WIN}"
  "Program|REG_SZ|${PROGRAM_WIN}"
  "InstallPathX|REG_SZ|${GAME_DIRECTORY_WIN}"
  "ProgramX|REG_SZ|${PROGRAM_X_WIN}"
)

# Sound registry values
SOUND_REG_VALUES=(
  "provider|REG_DWORD|1"
  "positional|REG_DWORD|1"
  "environmental|REG_DWORD|1"
  "music|REG_DWORD|1"
  "musicvolume|REG_DWORD|40"
  "sfx|REG_DWORD|1"
  "sfxvolume|REG_DWORD|100"
  "ambient|REG_DWORD|1"
  "movement|REG_DWORD|1"
  "unit|REG_DWORD|1"
  "subtitles|REG_DWORD|1"
  "nomidi|REG_DWORD|0"
  "softwaremidi|REG_DWORD|1"
  "nosoundwarn|REG_DWORD|1"
  "donotusewaveout|REG_DWORD|0"
)

# Video registry values
VIDEO_REG_VALUES=(
  "reswidth|REG_DWORD|${RES_WIDTH}"
  "resheight|REG_DWORD|${RES_HEIGHT}"
  "colordepth|REG_DWORD|32"
  "adapter|REG_DWORD|0"
  "refreshrate|REG_DWORD|${REFRESH_RATE}"
  "gamma|REG_DWORD|30"
  "modeldetail|REG_DWORD|2"
  "animquality|REG_DWORD|2"
  "texquality|REG_DWORD|2"
  "miplevel|REG_DWORD|0"
  "texcolordepth|REG_DWORD|32"
  "particles|REG_DWORD|2"
  "lights|REG_DWORD|2"
  "lockfb|REG_DWORD|1"
  "unitshadows|REG_DWORD|1"
  "occlusion|REG_DWORD|1"
  "cinematicoverrides|REG_DWORD|1"
  "cinematicrefresh|REG_DWORD|${REFRESH_RATE}"
  "cinematicbpp|REG_DWORD|32"
  "cinematicwidth|REG_DWORD|${RES_WIDTH}"
  "cinematicheight|REG_DWORD|${RES_HEIGHT}"
  "spellfilter|REG_DWORD|2"
  "maxfps|REG_DWORD|${MAX_FPS}"
)

# Apply registry values
set_prefix_registry_values "${REG_KEY}" "${REG_VALUES[@]}"
set_prefix_registry_values "${SOUND_REG_KEY}" "${SOUND_REG_VALUES[@]}"
set_prefix_registry_values "${VIDEO_REG_KEY}" "${VIDEO_REG_VALUES[@]}"

# Install required fonts
execute_prefix_winetricks fonts arial baekmuk

# Install and register video codecs
execute_prefix_winetricks lavfilters lavfilters
execute_prefix_wine blizzard_codec \
  regsvr32 /s "${GAME_DIRECTORY}/blizzard.ax"

# Install d3d8to9 translation layer
install_d3d8to9 "${GAME_DIRECTORY}"

# Download widescreen mod
download_game_file \
  "${GAME_DIRECTORY}/RenderEdge_Widescreen.mix" \
  "https://github.com/ENAleksey/RenderEdge_Widescreen/releases/download/v1.2.0c/RenderEdge_Widescreen.mix"

# Set framerate limit
set_framerate_limit "${MAX_FPS}"

# Force use of OpenGL
# command+=" -opengl"
