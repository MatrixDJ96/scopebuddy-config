# Age of Mythology: Retold

# Resolve game paths
GAME_CONFIG_PATH="Games/Age of Mythology Retold"

# Symlink user data to Windows user directory
symlink_directory \
  "${WINDOWS_USER_PATH}/${GAME_CONFIG_PATH}" \
  "${PREFIX_USER_PATH}/${GAME_CONFIG_PATH}"

# Set framerate limit
set_framerate_limit 60
